version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: bank
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbit:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  ms-config-server:
    build:
      context: .
      dockerfile: ms-config-server/Dockerfile
    ports: [ "8888:8888" ]
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  ms-eureka-server:
    build:
      context: .
      dockerfile: ms-eureka-server/Dockerfile
    ports: [ "8761:8761" ]
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  ms-clientes:
    build:
      context: .
      dockerfile: ms-clientes/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbit
      CONFIG_SERVER_URL: http://ms-config-server:8888
    depends_on:
      db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      ms-config-server:
        condition: service_healthy
      ms-eureka-server:
        condition: service_healthy
    ports: ["8080:8080"]
    networks:
      - banking-network
    restart: on-failure
  ms-cuentas:
    build:
      context: .
      dockerfile: ms-cuentas/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbit
      CONFIG_SERVER_URL: http://ms-config-server:8888
    depends_on:
      db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      ms-config-server:
        condition: service_healthy
      ms-eureka-server:
        condition: service_healthy
    ports: ["8081:8081"]
    networks:
      - banking-network
    restart: on-failure
  ms-gateway:
    build:
      context: .
      dockerfile: ms-gateway/Dockerfile
    depends_on:
      ms-config-server:
        condition: service_healthy
      ms-eureka-server:
        condition: service_healthy
    ports: ["8082:8082"]
    networks:
      - banking-network
    restart: on-failure
volumes:
  dbdata:

networks:
  banking-network:
    driver: bridge
